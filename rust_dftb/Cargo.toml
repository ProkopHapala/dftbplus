[package]
name = "rust_dftb"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.33"
ndarray = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
ocl = "0.19"
rhai = { version = "1.26", features = ["sync"] }
lapack = "0.20"
openblas-src = { version = "0.10", features = ["system"] }

# --- Build profiles: shrink disk footprint without losing backtrace quality ---
# See: blood_of_civilization/doc/AGENTS/notes/Memory_Issues/reduce_target_footprint_plan.md
#
# debug = 1            : line tables only (keeps panic file:line + function names
#                       in backtraces), drops variable/type debug info. Cuts
#                       debug info ~4x vs default debug=2.
# strip = "debuginfo"  : removes .debug_line/.debug_str/.debug_info from the
#                       final binary. .eh_frame (unwind tables) survives, so
#                       function-name backtraces still work without gdb.
#                       Measured: 935 MB -> 343 MB debug binary on boc project.
[profile.dev]
debug = 1
strip = "debuginfo"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
incremental = true
debug-assertions = true
overflow-checks = true
strip = "debuginfo"

# Profiling profile — optimized but with full debug info and no LTO,
# for use with perf/flamegraph. Benchmark with: --profile perf
[profile.perf]
inherits = "release"
debug = 2
debug-assertions = true
overflow-checks = true
lto = false
incremental = false
